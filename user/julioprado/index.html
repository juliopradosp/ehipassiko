<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Júlio Prado | Ehipassiko</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../favicon_io/favicon-16x16.png">
    <link rel="manifest" href="../../favicon_io/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
<div class="app-container">

    <div class="main-wrapper">
        <!-- Cabeçalho do Perfil -->
        <div id="profileHead" class="profile-header" onclick="window.location.hash = ''">
            <img src="https://via.placeholder.com/150" alt="Foto de Perfil" id="userPhoto" class="profile-pic">
            <div>
                <h1 id="userName" class="profile-name">Carregando...</h1>
            </div>
        </div>
        <div id="userBio" class="profile-bio">...</div>

        <!-- Menu de Navegação Atualizado -->
        <ul class="nav nav-tabs" id="mainNav">
            <li class="nav-item">
                <a class="nav-link active" href="#sobre-mim" data-target="sobre-mim">Sobre mim</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#leituras" data-target="leituras">Leituras</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#artigos" data-target="artigos">Artigos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#galeria" data-target="galeria">Galeria</a>
            </li>
        </ul>

        <!-- Área de Conteúdo Dinâmico -->
        <div id="contentArea"></div>
    </div>

    <!-- Footer Ehipassiko -->
    <footer class="app-footer">
        &copy; 2026 ehipassiko.com.br
        <span>"Venha e veja"</span>
    </footer>

</div>

<!-- Modal para Fotos e Vídeos -->
<div class="modal fade" id="mediaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center" id="modalMediaContent"></div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./script.js"></script>
</body>
</html>
